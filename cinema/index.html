<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Notes</title>
  <meta name="description" content="Find people, see the films they've watched, and read their detailed reviews.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://sg.media-imdb.com; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://m.media-amazon.com; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b5322a'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#/" class="brand" aria-label="Reel Notes home">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M12 9l12 7-12 7z" fill="#fff"/></svg>
        <span>Reel Notes</span>
      </a>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 105.2 12.9l4.2 4.2 1.4-1.4-4.2-4.2A7.5 7.5 0 0010.5 3zm0 2a5.5 5.5 0 110 11 5.5 5.5 0 010-11z" fill="currentColor"/></svg>
        <input id="search-input" type="search" placeholder="Search people or films…" aria-label="Search people or films">
      </form>
      <nav id="nav" class="nav" aria-label="Account"></nav>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="footer wrap">
    <a href="/">← Back to harshmistry.de</a> · Reviews are personal opinions. Film data and ratings live on <a href="https://www.imdb.com" target="_blank" rel="noopener noreferrer">IMDb&nbsp;↗</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="wrap">Reel Notes needs JavaScript to run.</p></noscript>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
